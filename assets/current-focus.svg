<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            /* Smooth, slower road scroll to simulate high speed */
            @keyframes mapScroll {
                0%   { transform: translateX(0); }
                100% { transform: translateX(-120px); }
            }
            
            /* Enemy cars move left SLOWER than the road scroll to simulate you passing them */
            @keyframes enemyMove {
                0%   { transform: translateX(1300px); }
                100% { transform: translateX(-200px); }
            }

            /* Player car weaves up and down through 3 lanes */
            @keyframes playerWeave {
                0%   { transform: translateY(0px); }
                20%  { transform: translateY(-60px); } /* Move to Top Lane */
                40%  { transform: translateY(-60px); }
                50%  { transform: translateY(0px); }   /* Back to Middle Lane */
                70%  { transform: translateY(60px); }  /* Move to Bottom Lane */
                90%  { transform: translateY(60px); }
                100% { transform: translateY(0px); }   /* Back to Middle Lane */
            }

            .road-layer {
                animation: mapScroll 0.8s linear infinite;
            }
            .enemy-1 { animation: enemyMove 12s linear infinite; }
            .enemy-2 { animation: enemyMove 14s linear infinite 2s; }
            .enemy-3 { animation: enemyMove 11s linear infinite 4s; }
            .enemy-4 { animation: enemyMove 13s linear infinite 6s; }
            
            .player-car {
                animation: playerWeave 8s ease-in-out infinite;
            }
        </style>

        <pattern id="grassPat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <rect width="40" height="20" fill="#2E8B2E"/>
            <rect y="20" width="40" height="20" fill="#33A533"/>
        </pattern>
    </defs>

    <!-- Grass Top -->
    <rect x="0" y="0" width="1200" height="80" fill="url(#grassPat)" />
    
    <!-- Grass Bottom -->
    <rect x="0" y="320" width="1200" height="80" fill="url(#grassPat)" />

    <!-- Road Asphalt (Horizontal Strip) -->
    <rect x="0" y="80" width="1200" height="240" fill="#333" />

    <!-- Road Edges (White lines) -->
    <rect x="0" y="84" width="1200" height="4" fill="#FFF" />
    <rect x="0" y="312" width="1200" height="4" fill="#FFF" />

    <!-- Scrolling Road Dashes (2 dividers for 3 lanes) -->
    <g class="road-layer" fill="#FFF" opacity="0.8">
        <!-- Lane 1|2 divider -->
        <rect x="0" y="170" width="60" height="8" />
        <rect x="120" y="170" width="60" height="8" />
        <rect x="240" y="170" width="60" height="8" />
        <rect x="360" y="170" width="60" height="8" />
        <rect x="480" y="170" width="60" height="8" />
        <rect x="600" y="170" width="60" height="8" />
        <rect x="720" y="170" width="60" height="8" />
        <rect x="840" y="170" width="60" height="8" />
        <rect x="960" y="170" width="60" height="8" />
        <rect x="1080" y="170" width="60" height="8" />
        <rect x="1200" y="170" width="60" height="8" />
        <rect x="1320" y="170" width="60" height="8" />
        
        <!-- Lane 2|3 divider -->
        <rect x="0" y="230" width="60" height="8" />
        <rect x="120" y="230" width="60" height="8" />
        <rect x="240" y="230" width="60" height="8" />
        <rect x="360" y="230" width="60" height="8" />
        <rect x="480" y="230" width="60" height="8" />
        <rect x="600" y="230" width="60" height="8" />
        <rect x="720" y="230" width="60" height="8" />
        <rect x="840" y="230" width="60" height="8" />
        <rect x="960" y="230" width="60" height="8" />
        <rect x="1080" y="230" width="60" height="8" />
        <rect x="1200" y="230" width="60" height="8" />
        <rect x="1320" y="230" width="60" height="8" />
    </g>

    <!-- ═══ ENEMY CARS (Slower Traffic) ═══ -->
    
    <!-- Enemy 1: Blue (Top Lane - y=140) -->
    <g class="enemy-1" transform="translate(1300, 140)">
        <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#0000FF" stroke="#000" stroke-width="2" />
        <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#111" />
        <rect x="-30" y="-22" width="10" height="8" fill="#000" />
        <rect x="20" y="-22" width="10" height="8" fill="#000" />
        <rect x="-30" y="14" width="10" height="8" fill="#000" />
        <rect x="20" y="14" width="10" height="8" fill="#000" />
        <text x="0" y="6" fill="#FFF" font-family="'Courier New', monospace" font-weight="bold" font-size="18" text-anchor="middle">B</text>
    </g>

    <!-- Enemy 2: Yellow (Middle Lane - y=200) -->
    <g class="enemy-2" transform="translate(1300, 200)">
        <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#FFFF00" stroke="#000" stroke-width="2" />
        <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#111" />
        <rect x="-30" y="-22" width="10" height="8" fill="#000" />
        <rect x="20" y="-22" width="10" height="8" fill="#000" />
        <rect x="-30" y="14" width="10" height="8" fill="#000" />
        <rect x="20" y="14" width="10" height="8" fill="#000" />
        <text x="0" y="6" fill="#000" font-family="'Courier New', monospace" font-weight="bold" font-size="18" text-anchor="middle">Y</text>
    </g>

    <!-- Enemy 3: Green (Bottom Lane - y=260) -->
    <g class="enemy-3" transform="translate(1300, 260)">
        <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#00FF00" stroke="#000" stroke-width="2" />
        <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#111" />
        <rect x="-30" y="-22" width="10" height="8" fill="#000" />
        <rect x="20" y="-22" width="10" height="8" fill="#000" />
        <rect x="-30" y="14" width="10" height="8" fill="#000" />
        <rect x="20" y="14" width="10" height="8" fill="#000" />
        <text x="0" y="6" fill="#000" font-family="'Courier New', monospace" font-weight="bold" font-size="18" text-anchor="middle">G</text>
    </g>

    <!-- Enemy 4: Cyan (Top Lane - y=140) -->
    <g class="enemy-4" transform="translate(1300, 140)">
        <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#00FFFF" stroke="#000" stroke-width="2" />
        <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#111" />
        <rect x="-30" y="-22" width="10" height="8" fill="#000" />
        <rect x="20" y="-22" width="10" height="8" fill="#000" />
        <rect x="-30" y="14" width="10" height="8" fill="#000" />
        <rect x="20" y="14" width="10" height="8" fill="#000" />
        <text x="0" y="6" fill="#000" font-family="'Courier New', monospace" font-weight="bold" font-size="18" text-anchor="middle">C</text>
    </g>

    <!-- ═══ PLAYER CAR (ME - Red, Weaving through traffic) ═══ -->
    <!-- Base position: x=300, y=200 (Middle Lane) -->
    <g transform="translate(300, 200)">
        <g class="player-car">
            <!-- Shadow -->
            <rect x="-28" y="-16" width="60" height="36" rx="6" fill="#000" opacity="0.4" transform="translate(3, 3)" />
            <!-- Body -->
            <rect x="-30" y="-18" width="60" height="36" rx="6" fill="#FF0000" stroke="#000" stroke-width="2" />
            <!-- Windshield -->
            <rect x="-18" y="-14" width="36" height="28" rx="4" fill="#000" />
            <rect x="-16" y="-12" width="32" height="12" rx="3" fill="#222" />
            <!-- Wheels -->
            <rect x="-30" y="-22" width="10" height="8" fill="#000" />
            <rect x="20" y="-22" width="10" height="8" fill="#000" />
            <rect x="-30" y="14" width="10" height="8" fill="#000" />
            <rect x="20" y="14" width="10" height="8" fill="#000" />
            <!-- Headlights -->
            <rect x="26" y="-12" width="4" height="6" fill="#FFF" />
            <rect x="26" y="6" width="4" height="6" fill="#FFF" />
            <!-- Label "ME" -->
            <text x="0" y="6" fill="#FFF" font-family="'Courier New', monospace" font-weight="bold" font-size="18" text-anchor="middle">ME</text>
        </g>
    </g>
</svg>
