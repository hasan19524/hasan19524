<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            /* Fast road scroll to simulate high speed */
            @keyframes mapScroll {
                0%   { transform: translateX(0); }
                100% { transform: translateX(-120px); }
            }
            
            /* Enemy cars move left SLOWER than the road scroll to simulate you passing them */
            @keyframes enemyMove {
                0%   { transform: translateX(1300px); }
                100% { transform: translateX(-200px); }
            }

            /* Player car weaves smoothly up and down through 3 lanes */
            /* Base Y=200. Up: -80 (Lane 1). Down: +80 (Lane 3) */
            @keyframes playerWeave {
                0%   { transform: translateY(0px); }
                15%  { transform: translateY(-80px); }
                35%  { transform: translateY(-80px); }
                50%  { transform: translateY(0px); }
                65%  { transform: translateY(80px); }
                85%  { transform: translateY(80px); }
                100% { transform: translateY(0px); }
            }

            .road-layer { animation: mapScroll 0.6s linear infinite; }
            
            .enemy-1 { animation: enemyMove 12s linear infinite; }
            .enemy-2 { animation: enemyMove 14s linear infinite 1.5s; }
            .enemy-3 { animation: enemyMove 11s linear infinite 3s; }
            .enemy-4 { animation: enemyMove 13s linear infinite 4.5s; }
            .enemy-5 { animation: enemyMove 12.5s linear infinite 6s; }
            .enemy-6 { animation: enemyMove 14.5s linear infinite 7.5s; }
            
            .player-car { animation: playerWeave 8s ease-in-out infinite; }
            
            .glow { filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }
        </style>
    </defs>

    <!-- Grass Top & Bottom (Matches GitHub Dark Mode bg) -->
    <rect x="0" y="0" width="1200" height="80" fill="#0d1117" />
    <rect x="0" y="320" width="1200" height="80" fill="#0d1117" />

    <!-- Road Asphalt -->
    <rect x="0" y="80" width="1200" height="240" fill="#21262d" />

    <!-- Road Edges (Subtle grey lines) -->
    <rect x="0" y="80" width="1200" height="2" fill="#484f58" />
    <rect x="0" y="318" width="1200" height="2" fill="#484f58" />

    <!-- Scrolling Road Dashes -->
    <g class="road-layer" fill="#484f58" opacity="0.8">
        <!-- Lane 1|2 divider (y=160) -->
        <rect x="0" y="158" width="60" height="4" />
        <rect x="120" y="158" width="60" height="4" />
        <rect x="240" y="158" width="60" height="4" />
        <rect x="360" y="158" width="60" height="4" />
        <rect x="480" y="158" width="60" height="4" />
        <rect x="600" y="158" width="60" height="4" />
        <rect x="720" y="158" width="60" height="4" />
        <rect x="840" y="158" width="60" height="4" />
        <rect x="960" y="158" width="60" height="4" />
        <rect x="1080" y="158" width="60" height="4" />
        <rect x="1200" y="158" width="60" height="4" />
        <rect x="1320" y="158" width="60" height="4" />
        
        <!-- Lane 2|3 divider (y=240) -->
        <rect x="0" y="238" width="60" height="4" />
        <rect x="120" y="238" width="60" height="4" />
        <rect x="240" y="238" width="60" height="4" />
        <rect x="360" y="238" width="60" height="4" />
        <rect x="480" y="238" width="60" height="4" />
        <rect x="600" y="238" width="60" height="4" />
        <rect x="720" y="238" width="60" height="4" />
        <rect x="840" y="238" width="60" height="4" />
        <rect x="960" y="238" width="60" height="4" />
        <rect x="1080" y="238" width="60" height="4" />
        <rect x="1200" y="238" width="60" height="4" />
        <rect x="1320" y="238" width="60" height="4" />
    </g>

    <!-- ═══ ENEMY CARS (Grey, Labeled "OTHER") ═══ -->
    
    <!-- Enemy 1 (Top Lane - y=120) -->
    <g class="enemy-1" transform="translate(1300, 120)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#8b949e" stroke="#6e7681" stroke-width="1" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">OTHER</text>
    </g>

    <!-- Enemy 2 (Middle Lane - y=200) -->
    <g class="enemy-2" transform="translate(1300, 200)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#8b949e" stroke="#6e7681" stroke-width="1" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">OTHER</text>
    </g>

    <!-- Enemy 3 (Bottom Lane - y=280) -->
    <g class="enemy-3" transform="translate(1300, 280)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#8b949e" stroke="#6e7681" stroke-width="1" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">OTHER</text>
    </g>

    <!-- Enemy 4 (Top Lane - y=120) -->
    <g class="enemy-4" transform="translate(1300, 120)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#8b949e" stroke="#6e7681" stroke-width="1" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">OTHER</text>
    </g>

    <!-- Enemy 5 (Middle Lane - y=200) -->
    <g class="enemy-5" transform="translate(1300, 200)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#8b949e" stroke="#6e7681" stroke-width="1" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">OTHER</text>
    </g>

    <!-- Enemy 6 (Bottom Lane - y=280) -->
    <g class="enemy-6" transform="translate(1300, 280)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#8b949e" stroke="#6e7681" stroke-width="1" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">OTHER</text>
    </g>

    <!-- ═══ PLAYER CAR (ME - White, Weaving through traffic) ═══ -->
    <!-- Base position: x=200, y=200 (Middle Lane) -->
    <g class="player-car glow" transform="translate(200, 200)">
        <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#ffffff" stroke="#c9d1d9" stroke-width="2" />
        <rect x="-22" y="-14" width="44" height="28" rx="4" fill="#0d1117" />
        <rect x="-35" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="-22" width="12" height="8" fill="#0d1117" />
        <rect x="-35" y="14" width="12" height="8" fill="#0d1117" />
        <rect x="23" y="14" width="12" height="8" fill="#0d1117" />
        <text x="0" y="5" fill="#fff" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">ME</text>
    </g>
</svg>
